include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  errors:
    one_member_abstracts: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "packages/**/build/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 100

linter:
  rules:
    lines_longer_than_80_chars: false
    dangling_library_doc_comments: false
    avoid_positional_boolean_parameters: false
    flutter_style_todos: false
