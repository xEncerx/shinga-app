name: shinga
description: "Shinga - Manga Tracker"
publish_to: "none"
version: 0.3.0

environment:
  sdk: ">=3.13.0"

workspace:
  - packages/*
  - tools/plugin_inspect

dependencies:
  auto_route: ^11.1.0
  bloc_concurrency: ^0.3.0
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  dotted_border: ^3.1.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  equatable: ^2.1.0

  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter

  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  http_cache_drift_store: ^7.0.1
  infinite_scroll_pagination: ^5.1.1
  json_annotation: ^4.12.0
  meta: ^1.19.0
  modal_bottom_sheet: ^3.0.0
  path_provider: ^2.1.6
  retrofit: ^4.10.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  stream_transform: ^2.1.1
  system_proxy_reader:
    path: packages/system_proxy_reader
  talker: ^5.1.20
  talker_bloc_logger: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.20
  ui_kit:
    path: packages/ui_kit
  url_launcher: ^6.3.2
  webview_guardian: ^0.3.0
  window_manager: ^0.5.2

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.0

  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3

  integration_test:
    sdk: flutter

  json_serializable: ^6.14.1
  mocktail: ^1.0.5

  plugin_protocol:
    path: packages/plugin_protocol
  plugin_runtime:
    path: packages/plugin_runtime
  plugin_runtime_d4rt:
    path: packages/plugin_runtime_d4rt

  retrofit_generator: ^10.2.8
  test: ^1.31.1

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/images/
    - shorebird.yaml

flutter_launcher_icons:
  image_path_android: "assets/icon/android_icon.png"
  android: true
  adaptive_icon_background: "assets/icon/android_icon_background.png"
  adaptive_icon_foreground: "assets/icon/android_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/android_icon_monochrome.png"
  windows:
    generate: true
    image_path: "assets/icon/windows_icon.png"
    icon_size: 48
